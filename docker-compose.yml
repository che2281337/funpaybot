services:
  funpaybot:
    build: .
    restart: unless-stopped
    environment:
      FUNPAY_GOLDEN_KEY: "${FUNPAY_GOLDEN_KEY}"
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
      TELEGRAM_PASSWORD: "${TELEGRAM_PASSWORD}"
      # FUNPAY_USER_AGENT: "Mozilla/5.0 ..."
      # TELEGRAM_PROXY: "socks5://user:pass@ip:port"   # если Telegram заблокирован
      # FUNPAY_PROXY: "socks5://user:pass@ip:port"     # обычно не нужен
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
